name: Node.js CI/CD

on:
  push:
    branches:
      - stag   # Chỉ chạy khi push lên nhánh 'stag'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/your_user/my-express-app
            git pull origin stag   # nhớ pull đúng nhánh stag
            npm install
            pm2 reload ecosystem.config.js --env production
